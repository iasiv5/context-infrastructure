<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            z-index: 2;
            animation: fadeInUp 1s ease-out;
        }
        
        .error-code {
            font-size: 12rem;
            font-weight: 800;
            margin-bottom: 0;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            position: relative;
        }
        
        .error-code::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            animation: shine 3s infinite;
        }
        
        .error-message {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            font-weight: 300;
            opacity: 0.9;
        }
        
        .error-description {
            font-size: 1.1rem;
            margin-bottom: 3rem;
            opacity: 0.7;
            max-width: 600px;
            line-height: 1.6;
            animation: fadeIn 1.5s ease-out 0.5s both;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            margin: 0 10px;
        }
        
        .btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            animation: fadeIn 1.5s ease-out 0.8s both;
        }
        
        .footer {
            position: absolute;
            bottom: 30px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
            width: 100%;
        }
        
        .footer p {
            margin: 5px 0;
        }
        
        .icp a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .icp a:hover {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: underline;
        }
        
        .circles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 15s infinite ease-in-out;
        }
        
        .circle:nth-child(1) {
            width: 80px;
            height: 80px;
            left: 10%;
            animation-delay: 0s;
        }
        
        .circle:nth-child(2) {
            width: 120px;
            height: 120px;
            left: 70%;
            animation-delay: 2s;
        }
        
        .circle:nth-child(3) {
            width: 60px;
            height: 60px;
            left: 40%;
            animation-delay: 4s;
        }
        
        .circle:nth-child(4) {
            width: 100px;
            height: 100px;
            left: 85%;
            animation-delay: 0s;
        }
        
        .circle:nth-child(5) {
            width: 50px;
            height: 50px;
            left: 25%;
            animation-delay: 3s;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            33% {
                transform: translateY(-100px) rotate(120deg);
            }
            66% {
                transform: translateY(-200px) rotate(240deg);
            }
        }
        
        @keyframes shine {
            0% {
                transform: translateX(-100%) skewX(-15deg);
            }
            20% {
                transform: translateX(100%) skewX(-15deg);
            }
            100% {
                transform: translateX(100%) skewX(-15deg);
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 0.7;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 8rem;
            }
            
            .error-message {
                font-size: 1.5rem;
            }
            
            .error-description {
                font-size: 1rem;
                padding: 0 20px;
            }
            
            .btn {
                display: block;
                margin: 10px auto;
                width: 200px;
            }
        }
    </style>
</head>

<body>
    <div class="circles">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
    
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-message">页面未找到 / Page Not Found</h1>
        <p class="error-description">
            抱歉，您访问的页面不存在或已被移动。<br>
            Sorry, the page you are looking for doesn't exist or has been moved.<br>
        </p>
        
        <div class="button-group">
            <a href="/" class="btn">返回首页 / Home</a>
            <a href="javascript:history.back()" class="btn">返回上页 / Back</a>
        </div>
    </div>
    
    <div class="footer">
        <p>版权所有 © 2025 Iasi FOSS / All Rights Reserved</p>
        <p class="icp">
            <a href="http://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">
                沪ICP备19029598号
            </a>
        </p>
    </div>
</body>
</html>
